# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
# tls.issuer has cert-manager issue the server certificate for every Service,
# poolers included, and clients verify it with the issuer's CA. Switching to
# tls.certificateSecretName and back to CloudNativePG's certificate reloads
# PostgreSQL without restarting it, and deletes the provider's Certificate.
# Moving to a CA CloudNativePG issues with has it issue the certificate again.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: tls-certificates
spec:
  timeouts:
    cleanup: 3m
  steps:
    - name: create-ca
      try:
        - apply:
            file: 00-ca.yaml
        - script:
            timeout: 2m
            content: kubectl wait --for=condition=Ready certificate/test-ca -n "$NAMESPACE" --timeout=90s

    - name: create-instance-with-issuer
      try:
        - apply:
            file: 01-instance.yaml
        - script:
            timeout: 8m
            content: |
              set -eu
              kubectl wait --for=create certificate/tls-certs-tls -n "$NAMESPACE" --timeout=60s
              kubectl wait --for=condition=Ready certificate/tls-certs-tls -n "$NAMESPACE" --timeout=120s
              kubectl wait --for=create cluster/tls-certs -n "$NAMESPACE" --timeout=60s
              kubectl wait --for=condition=Ready cluster/tls-certs -n "$NAMESPACE" --timeout=420s
              test "$(kubectl get cluster tls-certs -n "$NAMESPACE" -o jsonpath='{.spec.certificates.serverTLSSecret}')" = tls-certs-tls
              test "$(kubectl get secret tls-certs-tls -n "$NAMESPACE" -o jsonpath='{.metadata.ownerReferences[0].kind}')" = Certificate
              kubectl wait --for=condition=Available deployment/tls-certs-pooler -n "$NAMESPACE" --timeout=180s
      catch:
        - script:
            content: kubectl get instance,certificate,cluster,pooler,pod -n "$NAMESPACE" -o wide
        - script:
            content: kubectl get instance tls-certs -n "$NAMESPACE" -o jsonpath='{.status.conditions}'

    - name: verify-full-with-the-issuer-ca
      try:
        - script:
            timeout: 3m
            content: |
              set -eu
              password="$(kubectl get secret tls-certs-app -n "$NAMESPACE" -o jsonpath='{.data.password}' | base64 -d)"
              # server-ca.crt is the issuer's ca.crt, mounted from the Certificate's Secret.
              verify() {
                kubectl exec -n "$NAMESPACE" tls-certs-1 -c postgres -- env PGPASSWORD="$password" PGCONNECT_TIMEOUT=5 \
                  psql "host=$1 user=app dbname=app sslmode=verify-full sslrootcert=/controller/certificates/server-ca.crt" -tAc 'SELECT 1'
              }
              for host in tls-certs-rw."$NAMESPACE".svc tls-certs-r."$NAMESPACE".svc tls-certs-pooler."$NAMESPACE".svc; do
                test "$(verify "$host")" = 1 || { echo "verify-full failed for $host"; exit 1; }
              done
              issuer="$(kubectl exec -n "$NAMESPACE" tls-certs-1 -c postgres -- sh -c \
                'openssl s_client -starttls postgres -connect tls-certs-rw:5432 </dev/null 2>/dev/null | openssl x509 -noout -issuer')"
              echo "$issuer"
              case "$issuer" in *"Test Databases CA"*) ;; *) exit 1 ;; esac
              kubectl get certificate tls-certs-tls -n "$NAMESPACE" -o jsonpath='{.spec.dnsNames}' | grep -q tls-certs.example.com

    - name: switch-to-own-secret
      try:
        - script:
            timeout: 4m
            content: |
              set -eu
              # A certificate the user manages: issued here by cert-manager
              # into a Secret the provider does not own.
              kubectl apply -n "$NAMESPACE" -f - <<YAML
              apiVersion: cert-manager.io/v1
              kind: Certificate
              metadata:
                name: own-tls
              spec:
                secretName: own-tls
                commonName: Own server certificate
                dnsNames:
                  - tls-certs-rw
                  - tls-certs-rw.$NAMESPACE.svc
                  - tls-certs-r.$NAMESPACE.svc
                  - tls-certs-ro.$NAMESPACE.svc
                usages: [digital signature, key encipherment, server auth]
                issuerRef:
                  name: databases-ca
                  kind: Issuer
              YAML
              kubectl wait --for=condition=Ready certificate/own-tls -n "$NAMESPACE" --timeout=90s
              uid="$(kubectl get pod tls-certs-1 -n "$NAMESPACE" -o jsonpath='{.metadata.uid}')"
              kubectl patch instance/tls-certs -n "$NAMESPACE" --type=json -p \
                '[{"op":"replace","path":"/spec/components/engine/parameters/tls","value":{"certificateSecretName":"own-tls"}}]'
              want="$(kubectl get secret own-tls -n "$NAMESPACE" -o jsonpath='{.data.tls\.crt}' | base64 -d | openssl x509 -noout -serial)"
              for _ in $(seq 1 60); do
                got="$(kubectl exec -n "$NAMESPACE" tls-certs-1 -c postgres -- sh -c \
                  'openssl s_client -starttls postgres -connect tls-certs-rw:5432 </dev/null 2>/dev/null | openssl x509 -noout -serial' || true)"
                [ "$got" = "$want" ] && break
                sleep 3
              done
              echo "served $got, want $want"
              test "$got" = "$want"
              test "$(kubectl get secret own-tls -n "$NAMESPACE" -o jsonpath='{.metadata.labels.cnpg\.io/reload}')" = true
              kubectl wait --for=delete certificate/tls-certs-tls -n "$NAMESPACE" --timeout=120s
              kubectl wait --for=delete secret/tls-certs-tls -n "$NAMESPACE" --timeout=60s
              test "$(kubectl get pod tls-certs-1 -n "$NAMESPACE" -o jsonpath='{.metadata.uid}')" = "$uid"
      catch:
        - script:
            content: kubectl get instance tls-certs -n "$NAMESPACE" -o jsonpath='{.status.conditions}'

    - name: back-to-cloudnative-pg-certificate
      try:
        - script:
            timeout: 4m
            content: |
              set -eu
              kubectl patch instance/tls-certs -n "$NAMESPACE" --type=json -p \
                '[{"op":"remove","path":"/spec/components/engine/parameters/tls"}]'
              for _ in $(seq 1 60); do
                issuer="$(kubectl exec -n "$NAMESPACE" tls-certs-1 -c postgres -- sh -c \
                  'openssl s_client -starttls postgres -connect tls-certs-rw:5432 </dev/null 2>/dev/null | openssl x509 -noout -issuer' || true)"
                case "$issuer" in *"CN=tls-certs"*) break ;; esac
                sleep 3
              done
              echo "$issuer"
              case "$issuer" in *"CN=tls-certs"*) ;; *) exit 1 ;; esac
              kubectl wait --for=condition=Ready cluster/tls-certs -n "$NAMESPACE" --timeout=180s

    - name: switch-to-a-ca-cloudnative-pg-issues-with
      try:
        - script:
            timeout: 5m
            content: |
              set -eu
              # The test CA's key, which cert-manager writes in the SEC 1 form CloudNativePG reads.
              kubectl get secret test-ca -n "$NAMESPACE" -o go-template='{{index .data "tls.crt" | base64decode}}' > /tmp/"$NAMESPACE"-ca.crt
              kubectl get secret test-ca -n "$NAMESPACE" -o go-template='{{index .data "tls.key" | base64decode}}' > /tmp/"$NAMESPACE"-ca.key
              kubectl create secret generic own-ca -n "$NAMESPACE" \
                --from-file=ca.crt=/tmp/"$NAMESPACE"-ca.crt --from-file=ca.key=/tmp/"$NAMESPACE"-ca.key
              rm -f /tmp/"$NAMESPACE"-ca.crt /tmp/"$NAMESPACE"-ca.key
              uid="$(kubectl get pod tls-certs-1 -n "$NAMESPACE" -o jsonpath='{.metadata.uid}')"
              kubectl patch instance/tls-certs -n "$NAMESPACE" --type=merge \
                -p '{"spec":{"components":{"engine":{"parameters":{"certificates":{"serverCASecret":"own-ca"}}}}}}'
              # CloudNativePG keeps a certificate until it expires; the provider
              # has it issued again from the new CA.
              for _ in $(seq 1 80); do
                issuer="$(kubectl exec -n "$NAMESPACE" tls-certs-1 -c postgres -- sh -c \
                  'openssl s_client -starttls postgres -connect tls-certs-rw:5432 </dev/null 2>/dev/null | openssl x509 -noout -issuer' || true)"
                case "$issuer" in *"Test Databases CA"*) break ;; esac
                sleep 3
              done
              echo "$issuer"
              case "$issuer" in *"Test Databases CA"*) ;; *) exit 1 ;; esac
              kubectl wait --for=condition=Ready instance/tls-certs -n "$NAMESPACE" --timeout=180s
              test "$(kubectl get pod tls-certs-1 -n "$NAMESPACE" -o jsonpath='{.metadata.uid}')" = "$uid"
      catch:
        - script:
            content: kubectl get cluster tls-certs -n "$NAMESPACE" -o jsonpath='{.status.phase}{" | "}{.status.phaseReason}{"\n"}{.status.certificates}'
