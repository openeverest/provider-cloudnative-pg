apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: tls-certs
spec:
  providerRef:
    name: provider-cloudnative-pg
  components:
    engine:
      type: postgresql
      replicas: 2
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
      storage:
        size: 1Gi
      parameters:
        tls:
          issuer:
            name: databases-ca
          extraDNSNames:
            - tls-certs.example.com
    proxy:
      type: pgbouncer
      replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 100m
          memory: 128Mi
