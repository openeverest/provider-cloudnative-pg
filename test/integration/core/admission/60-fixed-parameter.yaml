apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: test-cnpg-fixed-parameter
spec:
  providerRef:
    name: provider-cloudnative-pg
  components:
    engine:
      type: postgresql
      replicas: 1
      resources:
        requests:
          cpu: 500m
          memory: 256Mi
        limits:
          cpu: "1"
          memory: 256Mi
      storage:
        size: 1Gi
      parameters:
        configuration: |
          max_connections = 50
          port = 6432
