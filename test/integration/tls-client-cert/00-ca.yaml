# A client CA: a self-signed issuer signs the CA certificate; the CA issuer
# signs application and (via ca.key in the Secret) CloudNativePG signs
# streaming_replica with that key.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: bootstrap
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: client-ca
spec:
  isCA: true
  commonName: Test Client CA
  secretName: client-ca
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: bootstrap
    kind: Issuer
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: client-ca
spec:
  ca:
    secretName: client-ca
