apiVersion: v1
kind: Secret
metadata:
  name: user-secret-wrong-credentials
type: kubernetes.io/basic-auth
stringData:
  username: alice
  password: Seeded-By-User-2
---
apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: user-secret-wrong
spec:
  providerRef:
    name: provider-cloudnative-pg
  userSecretRef:
    name: user-secret-wrong-credentials
  components:
    engine:
      type: postgresql
      replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
      storage:
        size: 1Gi
