apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: ext-partman
spec:
  providerRef:
    name: provider-cloudnative-pg
  version: "18.7"
  components:
    engine:
      type: postgresql
      replicas: 2
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 1Gi
      storage:
        size: 1Gi
      parameters:
        extensions:
          pgpartman:
            enabled: true
        postgresql:
          parameters:
            # Run maintenance every few seconds instead of every hour.
            pg_partman_bgw.interval: "5"
