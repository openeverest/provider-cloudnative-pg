apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: tsdb-community
status:
  phase: Provisioned
  (conditions[?type == 'Ready'].status | [0]): "True"
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: tsdb-community-extensions
spec:
  name: app
  cluster:
    name: tsdb-community
  extensions:
    - name: timescaledb
      version: "2.32.1"
status:
  applied: true
