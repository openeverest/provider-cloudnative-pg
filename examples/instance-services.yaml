# Instance with first-class engine.service exposure.
#
# Connection Secret keys (see README "Connection details"):
#   host      — read-write Service (<instance>-rw), or the LoadBalancer address
#               when serviceType is LoadBalancer (once assigned); or the pooler
#               when proxy is set
#   host-r    — every ready instance (<instance>-r); omitted if "r" is disabled
#   host-ro   — ready replicas only (<instance>-ro); needs replicas >= 2 and
#               "ro" not disabled
#
# Prefer engine.service over parameters.managed.services.additional. Adjust
# annotations for your cloud provider. Set sourceRanges on LoadBalancer so the
# LB is not open to the world (CIDRs or bare IPs). TLS: the published host is
# the LB address; CNPG cert SANs are the in-cluster Service DNS names — see
# README "Service exposure".
apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: my-database
spec:
  providerRef:
    name: provider-cloudnative-pg
  version: "18.7"
  components:
    engine:
      type: postgresql
      replicas: 3
      resources:
        requests:
          cpu: "1"
          memory: 1Gi
        limits:
          cpu: "1"
          memory: 1Gi
      storage:
        size: 5Gi
      service:
        serviceType: LoadBalancer
        annotations:
          service.beta.kubernetes.io/aws-load-balancer-type: nlb
        loadBalancerService:
          sourceRanges:
            - 10.0.0.0/8
