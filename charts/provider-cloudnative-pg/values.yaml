# Default values for provider-cloudnative-pg.

# -- Number of replicas for the provider deployment
replicaCount: 1

image:
  # -- Container image repository
  repository: ghcr.io/openeverest/provider-cloudnative-pg
  # -- Image pull policy
  pullPolicy: IfNotPresent
  # -- Overrides the image tag whose default is the chart appVersion
  tag: "0.3.4"

# -- Image pull secrets for private registries
imagePullSecrets: []

# -- Override the name of the chart
nameOverride: ""
# -- Override the full name of the chart
fullnameOverride: ""

serviceAccount:
  # -- Specifies whether a service account should be created
  create: true
  # -- Annotations to add to the service account
  annotations: {}
  # -- Automount API credentials for the service account
  automountServiceAccountToken: true
  # -- The name of the service account to use. If not set and create is true, a name is generated using the fullname template
  name: ""

rbac:
  # -- Specifies whether RBAC resources should be created
  create: true

# -- Annotations to add to the deployment pods
podAnnotations: {}

# -- Labels to add to the deployment pods
podLabels: {}

podSecurityContext:
  # -- Run as non-root
  runAsNonRoot: true
  # -- Security context fsGroup
  fsGroup: 65534

securityContext:
  # -- Disallow privilege escalation
  allowPrivilegeEscalation: false
  # -- Drop all capabilities
  capabilities:
    drop:
      - ALL
  # -- Read-only root filesystem
  readOnlyRootFilesystem: true
  # -- Run as non-root user
  runAsNonRoot: true
  # -- Run as user ID
  runAsUser: 65534

service:
  # -- Service type
  type: ClusterIP
  # -- Service port for the HTTP server (schema/validation endpoints)
  port: 8082

# -- Resource limits and requests
resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 15
  periodSeconds: 20

readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

# -- Node selector for pod scheduling
nodeSelector: {}

# -- Tolerations for pod scheduling
tolerations: []

# -- Affinity rules for pod scheduling
affinity: {}

provider:
  # -- The name to register for the Provider custom resource
  name: provider-cloudnative-pg
  # -- Short provider identifier, used as the prefix of preset names
  # (e.g. 'postgresql-replicaset').
  shortName: postgresql

openeverest:
  # -- Annotations to add to the objects of this chart that OpenEverest
  # interprets: the Provider, its BackupClass and the presets. A key under
  # openeverest.io/ belongs to the chart and to OpenEverest, and fails the
  # render.
  annotations: {}
    # For example, to have Argo CD apply these objects before the provider's
    # Deployment and the bundled CloudNativePG operator:
    # argocd.argoproj.io/sync-wave: "-1"

# -- ClusterInstancePresets installed with the provider: well-known starting
# points users pick when they create an Instance in any namespace. Each entry
# has a 'name' (prefixed with provider.shortName), 'enabled', and a 'spec' (an
# Instance spec; providerRef is set by the chart). Presets are cluster-scoped,
# so a spec must not reference namespaced objects such as Secrets or backup
# storages. version is the provider's default version bundle; keep it in step
# with definition/versions.yaml (a unit test checks it).
presets:
  - name: replicaset
    enabled: true
    spec:
      version: "18.7"
      topology:
        type: replicaSet
      components:
        engine:
          type: postgresql
          replicas: 3
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
            limits:
              cpu: "1"
              memory: 4Gi
          storage:
            size: 25Gi
      parameters:
        tls:
          mode: requireTLS

# Images of the first-class image-volume extensions (PostgreSQL 18+), as a
# CloudNativePG ClusterImageCatalog. The provider copies the entry of each
# enabled extension into the Cluster, so images can be bumped or mirrored here
# without upgrading the provider; changing one restarts the instances using it.
extensionCatalog:
  # -- Render the ClusterImageCatalog; set to false to manage it yourself
  create: true
  # -- Name of the ClusterImageCatalog the provider reads
  name: provider-cloudnative-pg-extensions
  # -- Entries per PostgreSQL major. `image` is required by CloudNativePG but
  # unused: the provider picks the PostgreSQL image from the Instance version.
  # Extension entries are CloudNativePG ExtensionConfigurations plus
  # `sqlVersion`, the CREATE EXTENSION version (empty for the image default),
  # and optionally `minVersion` (inclusive) / `maxVersion` (exclusive), the
  # PostgreSQL releases (major.minor) a build runs on, and `extension`, the
  # extension an entry provides when its name differs (e.g. pg-cron-pre-18-7).
  # Exactly one entry must cover each version an extension is enabled on.
  images:
    # Trixie builds from the upstream catalog
    # image-catalogs-extensions/catalog-minimal-trixie.yaml in
    # https://github.com/cloudnative-pg/artifacts; AGE, TimescaleDB
    # Community, pg_cron, pg_repack and pg_partman from
    # https://github.com/solanicaio/postgresql-extensions.
    # PostgreSQL 18.7 changed the extension ABI: builds for 18.7 don't load
    # on older releases and older builds are unsafe on 18.7, so each
    # extension has a build per range (`*-pre-18-7` for older releases).
    # TimescaleDB Community needs 18.6 or later: its oldest build is for 18.6.
    # pg_partman only has a build for 18.7 and later.
    - major: 18
      image: ghcr.io/cloudnative-pg/postgresql:18.7-standard-trixie
      extensions:
        - name: timescaledb-oss
          sqlVersion: "2.30.1"
          image:
            reference: ghcr.io/cloudnative-pg/timescaledb-oss:2.30.1-18-trixie
        # Timescale License (TSL) components: internal use only, or with a
        # license from Timescale. Needs PostgreSQL 18.6+.
        - name: timescaledb
          minVersion: "18.7"
          sqlVersion: "2.32.1"
          image:
            reference: ghcr.io/solanicaio/timescaledb:2.32.1-202611201424-18.7-trixie@sha256:ff3d18b8ad5885bb2570e3072ee8d989035070992432f0e9d0034dfcc74ad32a
        - name: timescaledb-pre-18-7
          extension: timescaledb
          maxVersion: "18.7"
          sqlVersion: "2.32.1"
          image:
            reference: ghcr.io/solanicaio/timescaledb:2.32.1-202611201424-18.6-trixie@sha256:d4ae58c0dd601574819c58126fa5cbbde9b33f4bdf005ff1d695389723caec8c
        - name: postgis
          minVersion: "18.7"
          sqlVersion: "3.7.0"
          image:
            reference: ghcr.io/cloudnative-pg/postgis-extension:3.7.0-202611160937-18-trixie@sha256:36ba894fc359b9ddedc41842a6debbc5a64cee30526d7efd80b09ef3207a43f2
          ld_library_path:
            - system
          env:
            - name: GDAL_DATA
              value: ${image_root}/share/gdal
            - name: PROJ_DATA
              value: ${image_root}/share/proj
        - name: postgis-pre-18-7
          extension: postgis
          maxVersion: "18.7"
          sqlVersion: "3.6.4"
          image:
            reference: ghcr.io/cloudnative-pg/postgis-extension:3.6.4-202610110422-18-trixie@sha256:84a8e286d79aaec6fe824a792179d11252745a0d2b139d88692424fa61494df0
          ld_library_path:
            - system
          env:
            - name: GDAL_DATA
              value: ${image_root}/share/gdal
            - name: PROJ_DATA
              value: ${image_root}/share/proj
        - name: pgrouting
          minVersion: "18.7"
          sqlVersion: "4.0.2"
          image:
            reference: ghcr.io/cloudnative-pg/pgrouting:4.0.2-202611160937-18-trixie@sha256:6b61e53579d22efbed716921385f8ffefbdd0acca2bebc47483c5da042494605
        - name: pgrouting-pre-18-7
          extension: pgrouting
          maxVersion: "18.7"
          sqlVersion: "4.0.1"
          image:
            reference: ghcr.io/cloudnative-pg/pgrouting:4.0.1-202610110422-18-trixie@sha256:a9e9f2b786c213bebcb3baffe09d04de844c16bf8420c7bdbd98122c2aa704a1
        - name: pg-ivm
          minVersion: "18.7"
          sqlVersion: "1.17"
          image:
            reference: ghcr.io/cloudnative-pg/pg-ivm:1.17-202611160937-18-trixie@sha256:c95b38558f5f614e0354e1a1ec27214f038a66bb956af44c9ff91c4878254eef
        - name: pg-ivm-pre-18-7
          extension: pg-ivm
          maxVersion: "18.7"
          sqlVersion: "1.15"
          image:
            reference: ghcr.io/cloudnative-pg/pg-ivm:1.15-202610110422-18-trixie@sha256:3f6d327ec3f8cdc4212789f0cfc95be81b723e51f869639d526de6236ecae874
        - name: wal2json
          minVersion: "18.7"
          image:
            reference: ghcr.io/cloudnative-pg/wal2json:2.7-202611160937-18-trixie@sha256:0f3c609eb2238647c394eb1be5842d3ab039eb431d418249f20eae2ddac804db
        - name: wal2json-pre-18-7
          extension: wal2json
          maxVersion: "18.7"
          image:
            reference: ghcr.io/cloudnative-pg/wal2json:2.6-202610110422-18-trixie@sha256:298e20b7e9a75553a7b0070237ff09af9122d5cae2689255c8203283aaf430d0
        - name: age
          minVersion: "18.7"
          sqlVersion: "1.8.0"
          image:
            reference: ghcr.io/solanicaio/age:1.8.0-202611161250-18-trixie@sha256:9ef552a94cb88b53fe0db2d6cd35a014562371532bb4c3ebb020c6757aae5b3a
        - name: age-pre-18-7
          extension: age
          maxVersion: "18.7"
          sqlVersion: "1.8.0"
          image:
            reference: ghcr.io/solanicaio/age:1.8.0-202610141050-18-trixie@sha256:2fb13aed71690dc127fb8ecb0eb1145c2acf8d4fe8fe25467818f484570f3601
        - name: pg-cron
          minVersion: "18.7"
          sqlVersion: "1.6"
          image:
            reference: ghcr.io/solanicaio/pg-cron:1.6.8-202611161250-18-trixie@sha256:8c41e15a135dae0c9dd1ff08d675d598b365af859995cbf38b52ea8bcbf38b0a
        - name: pg-cron-pre-18-7
          extension: pg-cron
          maxVersion: "18.7"
          sqlVersion: "1.6"
          image:
            reference: ghcr.io/solanicaio/pg-cron:1.6.8-202611071500-18-trixie@sha256:671b15442f7d492f1c855b37c3973d1366eccce1a8cd543990e6bdc8471944ca
        - name: pg-repack
          minVersion: "18.7"
          sqlVersion: "1.5.3"
          image:
            reference: ghcr.io/solanicaio/pg-repack:1.5.3-202611161250-18-trixie@sha256:7b73c30b4e321f2f8e58eeac81aa62b1a3dcc68bb84a070db5de483081da98de
        - name: pg-repack-pre-18-7
          extension: pg-repack
          maxVersion: "18.7"
          sqlVersion: "1.5.3"
          image:
            reference: ghcr.io/solanicaio/pg-repack:1.5.3-202611071500-18-trixie@sha256:40c3ab6c3497e7db91211be9c63a2a66ecb4f4431ebc08acb72268cc5c861872
        - name: pg-partman
          minVersion: "18.7"
          sqlVersion: "5.5.0"
          image:
            reference: ghcr.io/solanicaio/pg-partman:5.5.0-202611171122-18-trixie@sha256:aec9d402493fb6cd0cbb21e5ef4db3ae9ada6862a49c49b9d2fb0fbf4720aa80

# -- Additional environment variables to set on the provider container
extraEnv: []
# - name: MY_VAR
#   value: "my-value"

# -- Additional volume mounts to add to the provider container
extraVolumeMounts: []

# -- Additional volumes to add to the pod
extraVolumes: []

admission:
  # -- PEM serving certificate for the Instance admission webhook. Left empty,
  # the chart generates one and keeps it across upgrades.
  certs:
    tls.crt: ""
    tls.key: ""
    ca.crt: ""
  certManager:
    # -- Issue the serving certificate with cert-manager, which must be installed.
    enabled: false

compatibility:
  acknowledge:
    # -- Install and start the provider even though the OpenEverest in the
    # cluster does not serve the OpenEverest this chart is built for. Otherwise
    # a Helm install fails before anything is applied, and a build applied
    # without that check (Argo CD, pre-rendered manifests) stays unready until
    # OpenEverest serves it. The chart writes it on the Provider, where the
    # provider reads it at startup. Set it to the version of OpenEverest the
    # cluster runs, which the error names. It holds on that release and the
    # later ones that keep its contract, such as its patch releases, and
    # expires with the first OpenEverest release that changes the contract,
    # which is checked again. Set ahead of an upgrade, it does nothing until
    # that release is installed.
    coreVersion: ""

# -- Leader election configuration
leaderElection:
  # -- Enable leader election (recommended for HA deployments)
  enabled: true

cloudnative-pg:
  # -- Install the CloudNativePG operator as a chart dependency
  enabled: true
  fullnameOverride: cnpg-operator
  # -- CloudNativePG operator replicas. The operator drives PostgreSQL failover
  # and serves the Cluster admission webhooks; with a second replica (leader
  # election is always on) both stay available while one pod is rescheduled.
  replicaCount: 2
  # -- Prefer placing the operator replicas on different nodes.
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: cloudnative-pg
  # -- Prefer spreading the operator replicas across zones.
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: cloudnative-pg
  crds:
    create: true

# PodDisruptionBudget for the bundled CloudNativePG operator. Rendered only
# when cloudnative-pg.enabled is true and cloudnative-pg.replicaCount > 1.
cnpgOperatorPodDisruptionBudget:
  # -- Create a PodDisruptionBudget for the CloudNativePG operator pods
  enabled: true
  # -- Operator pods that must stay available during voluntary disruptions
  minAvailable: 1

# CNPG-I Barman Cloud Plugin — WAL archiving and base backups.
# Enabled by default so backups work out of the box. Installs into the same
# namespace as this release. Requires a cluster-wide cert-manager (not bundled:
# it is shared cluster infrastructure). Without the plugin, Instances surface
# BackupConfigured=False / BarmanPluginMissing when backups are enabled.
plugin-barman-cloud:
  # -- Install the Barman Cloud Plugin as a chart dependency (default: true)
  enabled: true
  crds:
    create: true
