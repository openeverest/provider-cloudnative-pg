apiVersion: v2
name: provider-cloudnative-pg
description: A Helm chart for deploying the OpenEverest provider-cloudnative-pg provider
type: application
version: 0.3.4
appVersion: "0.3.4"
keywords:
  - openeverest
  - provider
  - database
home: https://github.com/openeverest/provider-cloudnative-pg
sources:
  - https://github.com/openeverest/provider-cloudnative-pg
maintainers:
  - name: Aditya Pimpalkar
dependencies:
  - name: cloudnative-pg
    version: "0.29.2"
    repository: https://cloudnative-pg.github.io/charts
    condition: cloudnative-pg.enabled
  # CNPG-I Barman Cloud Plugin (appVersion v0.15.0, matches go.mod).
  - name: plugin-barman-cloud
    version: "0.8.0"
    repository: https://cloudnative-pg.github.io/charts
    condition: plugin-barman-cloud.enabled
annotations:
  openeverest.io/contract-version: "2.0.0-alpha.1.next"
